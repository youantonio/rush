<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064E3B">
<title>Enlaces</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAF6F0;--card:#FFFFFF;--ink:#111827;--muted:#57534E;--brand:#064E3B;--accent:#D97706;--line:#E7E5E4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:0 0 40px}
  header{background:linear-gradient(135deg,#064E3B,#022C22);color:#fff;text-align:center;padding:44px 20px 56px;border-bottom:4px solid var(--accent)}
  h1{font-family:'Playfair Display',serif;font-size:32px;line-height:1.15}
  .sub{margin-top:8px;font-size:14px;color:#D1FAE5}
  .wrap{max-width:460px;margin:0 auto;padding:18px 18px 0;position:relative;z-index:1}
  .link-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.04);cursor:pointer;transition:transform .15s}
  .link-card:active{transform:scale(.98)}
  .link-card .ic{font-size:26px;width:40px;text-align:center;flex-shrink:0}
  .link-card b{display:block;font-size:15px}
  .link-card .d{font-size:12px;color:var(--muted);margin-top:2px}
  .link-card .go{margin-left:auto;color:var(--muted);flex-shrink:0}
  .link-card.brand{border-color:var(--brand);background:rgba(6,78,59,.05)}
  .link-card.accent{border-color:var(--accent);background:rgba(217,119,6,.06)}
  .section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:20px 0 8px 4px}
  .wifi-box{background:var(--card);border:1px dashed var(--accent);border-radius:16px;padding:16px 18px;margin-bottom:12px}
  .wifi-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .wifi-row b{font-size:15px}
  .wifi-row button{background:var(--brand);color:#fff;border:none;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.show{opacity:1}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
  footer{text-align:center;font-size:11px;color:var(--muted);margin-top:26px}
</style>
</head>
<body>
<header>
  <h1 id="bizName">Cargando…</h1>
  <p class="sub" id="bizTagline"></p>
</header>
<div class="wrap" id="links"></div>
<footer id="footNote"></footer>
<div id="toast" class="toast"></div>
<script>
const BASE=(location.pathname.match(/^(\/t\/[a-z0-9-]+\/)/)||[,'/'])[1];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(window._t); window._t=setTimeout(()=>t.classList.remove('show'),2200); }
function copyText(t){ navigator.clipboard?.writeText(t).then(()=>toast('Copiado ✅')).catch(()=>toast('No se pudo copiar')); }

function Card({href,icon,title,desc,cls,onclick}){
  const tag = href ? 'a' : 'div';
  const attrs = href ? `href="${esc(href)}" target="_blank" rel="noopener"` : '';
  return `<${tag} ${attrs} class="link-card ${cls||''}" ${onclick?`onclick="${onclick}"`:''}>
    <div class="ic">${icon}</div>
    <div><b>${esc(title)}</b>${desc?`<div class="d">${esc(desc)}</div>`:''}</div>
    <div class="go">›</div>
  </${tag}>`;
}

(async function boot(){
  let s={};
  try{ s = await (await fetch(BASE+'api/public-settings')).json(); }catch(e){}
  $('bizName').textContent = s.business_name || 'Nuestro negocio';
  $('bizTagline').textContent = s.hub_tagline || 'Elige una opción para continuar';

  const rows=[];
  rows.push(Card({href:BASE+'menu.html', icon:'🍽️', title:'Ver menú y pedir', desc:'Ordena directo desde tu celular', cls:'brand'}));
  if(s.promo_link) rows.push(Card({href:s.promo_link, icon:'🎁', title:'Promociones', desc:'Lo que tenemos para ti hoy', cls:'accent'}));
  rows.push(Card({href:BASE+'unirme.html', icon:'⭐', title:'Tarjeta de lealtad', desc:'Junta estrellas en cada visita'}));

  rows.push(`<div class="section-label">Síguenos y opina</div>`);
  const social=[];
  if(s.google_reviews_link) social.push(Card({href:s.google_reviews_link, icon:'⭐', title:'Déjanos una reseña', desc:'En Google Maps'}));
  if(s.instagram_link) social.push(Card({href:s.instagram_link, icon:'📸', title:'Instagram'}));
  if(s.facebook_link) social.push(Card({href:s.facebook_link, icon:'📘', title:'Facebook'}));
  if(s.whatsapp_order_number) social.push(Card({href:`https://wa.me/52${s.whatsapp_order_number}`, icon:'💬', title:'WhatsApp'}));
  rows.push(social.length?social.join(''):`<p class="empty" style="padding:10px">Aún no hay redes configuradas.</p>`);

  if(s.wifi_network){
    rows.push(`<div class="section-label">Conéctate</div>`);
    rows.push(`<div class="wifi-box">
      <b>📶 ${esc(s.wifi_network)}</b>
      <div class="wifi-row"><span id="wifiPassTxt">${s.wifi_password?'••••••••':'Sin contraseña'}</span>
      ${s.wifi_password?`<button onclick="copyText('${esc(s.wifi_password).replace(/'/g,"\\'")}')">Copiar clave</button>`:''}</div>
    </div>`);
  }

  if(Array.isArray(s.hub_extra_links) && s.hub_extra_links.length){
    rows.push(`<div class="section-label">Más</div>`);
    rows.push(s.hub_extra_links.map(x=>Card({href:x.url, icon:'🔗', title:x.label})).join(''));
  }

  $('links').innerHTML = rows.join('');
  $('footNote').textContent = s.business_hours || '';
})();
</script>
</body>
</html>

</html>
